  <text x="880" y="77" fill="#0a0a0a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Inquire</text>

  <!-- Hero Editorial Headline -->
  <text x="48" y="156" fill="#d4af37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.15em">CREATIVE TALENT MANAGEMENT</text>
  <text x="48" y="196" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.03em">Representing Visionary Creators</text>
  <text x="48" y="226" fill="#737373" font-family="system-ui, sans-serif" font-size="14">A high-fashion, high-contrast dark aesthetic built with pure semantic HTML5 and modern CSS.</text>

