<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <!-- Window frame background -->
  <rect width="960" height="540" rx="12" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="11.5" stroke="#262626" stroke-width="1"/>

  <!-- Browser Chrome Topbar -->
