  <!-- Card 1 -->
  <rect x="48" y="254" width="268" height="250" rx="6" fill="#171717" stroke="#262626" stroke-width="1"/>
  <rect x="48" y="254" width="268" height="150" rx="6" fill="#262626"/>
  <circle cx="182" cy="329" r="40" fill="#333333"/>
  <text x="64" y="434" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Maya Sterling</text>
  <text x="64" y="454" fill="#d4af37" font-family="'JetBrains Mono', monospace" font-size="11">Editorial &amp; Runway · London</text>
  <text x="64" y="484" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="12">Vogue UK, Dazed Magazine, Milan FW</text>

